services:

  chalet-core:
    container_name: chalet-core
    image: chalet-core:1.0.6
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      chalet-db:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_DATASOURCE_URL: jdbc:mysql://chalet-db:3306/chalet_db
      SPRING_DATASOURCE_USERNAME: ${CHALET_DB_APP_USER:-chalet_app}
      SPRING_DATASOURCE_PASSWORD: ${CHALET_DB_APP_PASSWORD:-chalet_app_dev}
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  chalet-db:
    container_name: chalet-db
    image: mysql:8.4
    ports:
      - "2211:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${CHALET_DB_ROOT_PASSWORD:-root_dev}
      MYSQL_DATABASE: chalet_db
      MYSQL_USER: ${CHALET_DB_APP_USER:-chalet_app}
      MYSQL_PASSWORD: ${CHALET_DB_APP_PASSWORD:-chalet_app_dev}
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - chalet-core-mysql:/var/lib/mysql
    restart: unless-stopped

  chalet-db-temp:
    container_name: chalet-db-temp
    image: mysql:8.4
    profiles:
      - temp
    ports:
      - "2212:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${CHALET_DB_ROOT_PASSWORD:-root_dev}
      MYSQL_DATABASE: chalet_db_tmp
      MYSQL_USER: ${CHALET_DB_APP_USER:-chalet_app}
      MYSQL_PASSWORD: ${CHALET_DB_APP_PASSWORD:-chalet_app_dev}

  jenkins:
    container_name: chalet-jenkins
    image: jenkins/jenkins:lts-jdk21
    profiles:
      - ci
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - chalet-core-jenkins:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  chalet-core-mysql:
  chalet-core-jenkins:
