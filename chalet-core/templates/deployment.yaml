apiVersion: apps/v1
kind: Deployment

metadata:
  name: chalet-core-deployment

spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: chalet-core

  template:
    metadata:
      labels:
        app: chalet-core

    spec:
      initContainers:
        - name: wait-for-mysql
          image: {{ .Values.mysql.image }}
          env:
            - name: MYSQL_USER
              value: {{ .Values.mysql.username | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "chalet-core.mysqlAppSecretName" . }}
                  key: {{ .Values.mysql.auth.appPasswordKey }}
          command:
            - sh
            - -c
            - |
              until mysqladmin ping -h chalet-core-mysql-service -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent; do
                echo "Waiting for MySQL..."
                sleep 2
              done

      imagePullSecrets:
        - name: ecr-secret

      containers:
        - name: chalet-core-container
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: {{ .Values.service.port }}

          envFrom:
            - configMapRef:
                name: chalet-core-config

          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "chalet-core.mysqlAppSecretName" . }}
                  key: {{ .Values.mysql.auth.appPasswordKey }}

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
