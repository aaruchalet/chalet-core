name: Gradle CI

on:
  pull_request:

  push:
    branches:
      - develop

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build, Test, and Generate Coverage
        run: ./gradlew clean build jacocoTestReport

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/
          if-no-files-found: error

      - name: Build Docker Image
        run: |
          docker build \
            -t aaru-chalet:${{ github.sha }} \
            .

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm Chart
        run: helm lint ./chalet-core --set mysql.auth.rootPassword=ci-placeholder

      - name: Render Helm Templates
        run: >-
          helm template chalet-core ./chalet-core
          --set mysql.auth.rootPassword=ci-placeholder
          > /dev/null
