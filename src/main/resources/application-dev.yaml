spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:2211/chalet_db}
    username: ${SPRING_DATASOURCE_USERNAME:chalet_app}
    password: ${SPRING_DATASOURCE_PASSWORD:chalet_app_dev}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.flywaydb: DEBUG

management:
  endpoint:
    health:
      show-details: always
